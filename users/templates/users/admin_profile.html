{% extends 'core/base.html' %}
{% block content %}
<div class="container" style="max-width:600px;">
    <div class="glass-card" style="text-align:center;">
        {% if user.avatar %}<img src="{{ user.avatar.url }}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:12px;">{% endif %}
        <h1 style="font-weight:700;">Администратор</h1>
        <p style="color:#666;">{{ user.email }}</p>
        <div style="margin-top:24px;display:flex;flex-direction:column;gap:8px;">
            <a href="/admin/" class="btn-glass">⚙️ Панель администратора</a>
            <a href="{% url 'competition_list' %}" class="btn-glass-outline">🏊 Соревнования</a>
            <a href="{% url 'chat_list' %}" class="btn-glass-outline">💬 Чаты</a>
            <a href="{% url 'wall_of_fame' %}" class="btn-glass-outline">🏆 Стена почёта</a>
        </div>
    </div>
</div>
{% endblock %}
