<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школа плавания iSwim</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background: #0077b6; padding: 15px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/">Главная</a>
            <a href="/news/">Новости</a>
            <a href="/academy/">Академия</a>
            <a href="/branches/">Филиалы</a>
            <a href="/trainers/">Тренеры</a>
            {% if user.is_authenticated %}
                <a href="/profile/">Личный кабинет</a>
                <a href="/accounts/logout/">Выйти</a>
            {% else %}
                <a href="/accounts/login/">Войти</a>
                <a href="/accounts/signup/">Регистрация</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
