{% extends 'core/base.html' %}
{% block content %}
<div class="container" style="height:calc(100vh - 200px);display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
        <a href="{% url 'chat_list' %}" style="font-size:24px;text-decoration:none;">←</a>
        <h2 style="margin:0;">{{ room.name }}</h2>
        <span style="color:#999;font-size:14px;">{{ room.participants.count }} участников</span>
    </div>
    
    <div id="messages" style="flex:1;overflow-y:auto;padding:16px;background:rgba(255,255,255,0.3);border-radius:16px;margin-bottom:16px;">
        {% for msg in messages %}
            <div style="margin-bottom:12px;display:flex;gap:8px;{% if msg.sender == user %}flex-direction:row-reverse;{% endif %}">
                <div style="width:36px;height:36px;border-radius:50%;background:{% if msg.sender == user %}#1a73e8{% else %}rgba(0,0,0,0.1){% endif %};display:flex;align-items:center;justify-content:center;color:{% if msg.sender == user %}white{% else %}#333{% endif %};font-size:14px;font-weight:600;flex-shrink:0;">
                    {{ msg.sender.get_full_name|slice:":1" }}
                </div>
                <div style="max-width:70%;">
                    <div style="font-size:12px;color:#999;margin-bottom:2px;">{{ msg.sender.get_full_name }} {{ msg.created_at|date:"H:i" }}</div>
                    <div style="background:{% if msg.sender == user %}#1a73e8;color:white;{% else %}rgba(255,255,255,0.8);{% endif %}padding:10px 16px;border-radius:16px;word-wrap:break-word;">
                        {{ msg.text }}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
    
    <div id="typing-indicator" style="font-size:12px;color:#999;margin-bottom:4px;min-height:18px;"></div>
    
    <form id="message-form" style="display:flex;gap:8px;">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off" style="flex:1;padding:12px 16px;border-radius:14px;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.7);font-family:Inter,sans-serif;">
        <button type="submit" class="btn-glass">Отправить</button>
    </form>
</div>

<script>
const roomId = {{ room.id }};
const userId = {{ user.id }};
const socket = new WebSocket('ws://' + window.location.host + '/ws/chat/' + roomId + '/');
const messagesDiv = document.getElementById('messages');

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.type === 'chat_message') {
        const isMe = data.sender_id === userId;
        const div = document.createElement('div');
        div.style.cssText = 'margin-bottom:12px;display:flex;gap:8px;' + (isMe ? 'flex-direction:row-reverse;' : '');
        div.innerHTML = `
            <div style="width:36px;height:36px;border-radius:50%;background:${isMe?'#1a73e8':'rgba(0,0,0,0.1)'};display:flex;align-items:center;justify-content:center;color:${isMe?'white':'#333'};font-size:14px;font-weight:600;flex-shrink:0;">
                ${data.sender_name.slice(0,1)}
            </div>
            <div style="max-width:70%;">
                <div style="font-size:12px;color:#999;">${data.sender_name} ${data.time}</div>
                <div style="background:${isMe?'#1a73e8;color:white;':'rgba(255,255,255,0.8);'};padding:10px 16px;border-radius:16px;">${data.message}</div>
            </div>
        `;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        document.getElementById('typing-indicator').textContent = '';
    } else if (data.type === 'user_typing' && data.user_id !== userId) {
        document.getElementById('typing-indicator').textContent = data.typing ? data.user_name + ' печатает...' : '';
    }
};

document.getElementById('message-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (text) {
        socket.send(JSON.stringify({action: 'message', text: text}));
        input.value = '';
    }
});

let typingTimer;
document.getElementById('message-input').addEventListener('input', function() {
    socket.send(JSON.stringify({action: 'typing', typing: true}));
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function() {
        socket.send(JSON.stringify({action: 'typing', typing: false}));
    }, 1500);
});
</script>
{% endblock %}
