services:
  - type: web
    name: iswim-django
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT swim_site.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iswim-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: iswim-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com

databases:
  - name: iswim-db
    plan: free

  - name: iswim-redis
    plan: free
