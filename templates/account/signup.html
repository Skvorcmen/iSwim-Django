{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Регистрация</h2>
                <form method="post" action="{% url 'account_signup' %}">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            {% for field in form %}
                                {% for error in field.errors %}
                                    {{ error }}<br>
                                {% endfor %}
                            {% endfor %}
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="id_email" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Пароль</label>
                        <input type="password" name="password1" class="form-control" id="id_password1" required>
                        <small class="text-muted">Минимум 8 символов, не только цифры</small>
                    </div>
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Пароль (ещё раз)</label>
                        <input type="password" name="password2" class="form-control" id="id_password2" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>
                <hr>
                <p class="text-center">
                    Уже есть аккаунт? <a href="{% url 'account_login' %}">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
