{% extends 'core/base.html' %}
{% load i18n %}
{% load account socialaccount %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Вход в личный кабинет</h2>
                <form method="post" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">Проверьте правильность введённых данных</div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="id_login" class="form-label">Email</label>
                        <input type="email" name="login" class="form-control" id="id_login" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="id_remember">
                        <label class="form-check-label" for="id_remember">Запомнить меня</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    <a href="{% url 'account_reset_password' %}">Забыли пароль?</a>
                </p>
                <p class="text-center mt-2">
                    Нет аккаунта? <a href="{% url 'account_signup' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
