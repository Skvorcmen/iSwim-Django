{% extends 'core/base.html' %}
{% block content %}
<div style="max-width:420px;margin:60px auto;padding:0 16px;">
    <div class="glass-card" style="padding:36px 28px;">
        <h2 style="font-weight:700;text-align:center;margin-bottom:28px;font-size:24px;">Вход в личный кабинет</h2>
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {% if form.errors %}
                <div style="background:rgba(255,59,48,0.1);color:#ff3b30;padding:12px;border-radius:12px;margin-bottom:20px;text-align:center;font-size:14px;">
                    Неверный email или пароль
                </div>
            {% endif %}
            
            <label style="font-weight:600;font-size:14px;color:#333;display:block;margin-bottom:6px;">Email</label>
            <input type="email" name="login" placeholder="Введите email" required style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ddd;background:#fff;font-size:16px;color:#1a1a2e;margin-bottom:18px;outline:none;transition:border 0.2s;">
            
            <label style="font-weight:600;font-size:14px;color:#333;display:block;margin-bottom:6px;">Пароль</label>
            <input type="password" name="password" placeholder="Введите пароль" required style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ddd;background:#fff;font-size:16px;color:#1a1a2e;margin-bottom:14px;outline:none;transition:border 0.2s;">
            
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
                <input type="checkbox" name="remember" id="id_remember" style="width:18px;height:18px;accent-color:#1a73e8;">
                <label for="id_remember" style="font-size:14px;color:#666;cursor:pointer;">Запомнить меня</label>
            </div>
            
            <button type="submit" style="width:100%;padding:14px;background:#1a73e8;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;">Войти</button>
        </form>
        <p style="text-align:center;margin-top:18px;font-size:14px;"><a href="{% url 'account_reset_password' %}" style="color:#999;">Забыли пароль?</a></p>
        <p style="text-align:center;margin-top:6px;font-size:14px;color:#666;">Нет аккаунта? <a href="{% url 'account_signup' %}" style="color:#1a73e8;font-weight:600;">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
