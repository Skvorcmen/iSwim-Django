{% extends 'core/base.html' %}
{% block content %}
<div class="container">
    <h1 class="page-title">Наши тренеры</h1>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;">
        {% for trainer in trainers %}
            <a href="{% url 'trainer_detail' trainer.pk %}" style="text-decoration:none;color:inherit;">
                <div class="glass-card" style="text-align:center;height:100%;">
                    {% if trainer.photo %}
                        <img src="{{ trainer.photo.url }}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:12px;">
                    {% endif %}
                    <h2 style="font-weight:700;margin-bottom:4px;">{{ trainer.user.get_full_name }}</h2>
                    <p style="color:#666;margin-bottom:4px;">{{ trainer.specialization }}</p>
                    <p style="color:#999;">Стаж: {{ trainer.experience_years }} лет</p>
                </div>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
